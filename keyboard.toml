[keyboard]
name = "Alpyg RMK"
product_name = "Alpyg RMK"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "alpyg"
board = "XIAO BLE"
usb_enable = true

[ble]
enabled = true

[split]
connection = "ble"

[storage]
clear_storage = true

[dependency]
defmt_log = false

[split.central]
rows = 5
cols = 6
row_offset = 0
col_offset = 0

[split.central.matrix]
row_pins = ["P1_15", "P1_14", "P1_13", "P1_11", "P1_12"]
col_pins = ["P0_02", "P0_03", "P0_28", "P0_29", "P0_04", "P0_05"]
# row2col = true

[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 6

[split.peripheral.matrix]
row_pins = ["P0_29", "P0_04", "P0_05", "P1_12", "P1_11"]
col_pins = ["P1_13", "P1_14", "P1_15", "P0_28", "P0_03", "P0_02"]
# row2col = true

[rmk]
debounce_time = 50
split_peripherals_num = 1

[aliases]
l1 = "LT(1, tab, LAY)"
l2 = "LT(2, bspc, LAY)"
l3 = "LT(3, ropt, LAY)"
lp = "SHIFTED(9)"
rp = "SHIFTED(0)"
lc = "SHIFTED([)"
rc = "SHIFTED(])"

[layout]
rows = 5
cols = 12
map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,L) (0,6,R) (0,7,R) (0,8,R) (0,9,R) (0,10,R) (0,11,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,L) (1,6,R) (1,7,R) (1,8,R) (1,9,R) (1,10,R) (1,11,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,L) (2,6,R) (2,7,R) (2,8,R) (2,9,R) (2,10,R) (2,11,R)
(3,0,L) (3,1,L) (3,2,L) (3,3,L) (3,4,L) (3,5,L) (3,6,R) (3,7,R) (3,8,R) (3,9,R) (3,10,R) (3,11,R)
                        (4,3,L) (4,4,L) (4,5,L) (4,6,R) (4,7,R) (4,8,R)
"""

[keymap]
layers = 5

[[keymap.layer]]
name = "base"
keys = """
  esc   1     2     3     4     5     6     7     8     9     0     -
  lopt  q     w     e     r     t     y     u     i     o     p     \\
  lsft  a     s     d     f     g     h     j     k     l     ;     '
  lctl  z     x     c     v     b     n     m     comm  dot   /     rctl
                    lgui  @l1   spc   ent   @l2   @l3
"""

[[keymap.layer]]
name = "num"
keys = """
  grv   _     _     _     _     _     _     _     _     _     _     =
  tab   _     _     _     _     _     _     _     [     ]     _     _
  _     _     _     _     _     _     _     _     @lp   @rp   _     _
  _     _     _     _     _     _     _     _     @lc   @rc   _     _
                    _     _     _     _     _     _
"""

[[keymap.layer]]
name = "nav"
keys = """
  _     _     _     _     _     _     pscr  pgup  _     Home  _     =
  _     _     _     _     _     _     _     pgdn  Up    End   _     _
  _     _     _     _     _     _     _     left  Down  rght  _     rsft
  _     _     _     _     _     _     Del   _     _     _     _     _
                    _     _     _     _     _     _
"""

[[keymap.layer]]
name = "fn"
keys = """
  F1    F2    F3    F4    F5    F6    F7    F8    F9    F10   F11   F12
  _     _     _     _     _     _     _     mute  vold  volu  _     _
  _     _     _     _     _     _     _     mply  mprv  mnxt  _     _
  _     _     _     _     _     _     _     _     _     _     _     _
                    _     _     _     _     _     _
"""

